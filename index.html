<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>완벽한 원 그리기 게임 - Perfect Circle Drawing Game</title>
    <meta name="description" content="마우스로 완벽한 원을 그려보세요! 100점에 도전하는 재미있는 무료 온라인 게임">
    <meta name="keywords" content="원 그리기, 게임, 무료게임, circle game, drawing game">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
        }
        .ad-placeholder {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: 2px dashed #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            min-height: 90px;
        }
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        .animate-bounce-once {
            animation: bounce 0.5s ease-in-out;
        }
    </style>
</head>
<body>
    <!-- 상단 광고 영역 - PropellerAds 배너 -->
    <div style="max-width: 728px; margin: 20px auto; padding: 0 16px;">
        <div class="ad-placeholder">
            <div class="text-center">
                <div class="text-sm">PropellerAds 배너 광고 (728x90)</div>
                <div class="text-xs mt-1 opacity-75">승인 후 광고 코드를 여기에 붙여넣으세요</div>
            </div>
        </div>
    </div>

    <div id="root"></div>

    <!-- 하단 광고 영역 - PropellerAds 배너 -->
    <div style="max-width: 728px; margin: 20px auto; padding: 0 16px;">
        <div class="ad-placeholder">
            <div class="text-center">
                <div class="text-sm">PropellerAds 배너 광고 (728x90)</div>
                <div class="text-xs mt-1 opacity-75">승인 후 광고 코드를 여기에 붙여넣으세요</div>
            </div>
        </div>
    </div>

    <script>
        const { useState, useRef, useEffect } = React;

        function PerfectCircleGame() {
            const canvasRef = useRef(null);
            const [isDrawing, setIsDrawing] = useState(false);
            const [points, setPoints] = useState([]);
            const [score, setScore] = useState(null);
            const [bestScore, setBestScore] = useState(function() {
                const saved = localStorage.getItem('bestScore');
                return saved ? parseFloat(saved) : 0;
            });
            const [totalGames, setTotalGames] = useState(function() {
                const saved = localStorage.getItem('totalGames');
                return saved ? parseInt(saved) : 0;
            });
            const [showResult, setShowResult] = useState(false);

            useEffect(function() {
                const canvas = canvasRef.current;
                if (!canvas) return;
                
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                if (!isDrawing && points.length === 0) {
                    ctx.strokeStyle = '#334155';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(300, 300, 150, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }, [isDrawing, points]);

            const getCoordinates = function(e) {
                const canvas = canvasRef.current;
                const rect = canvas.getBoundingClientRect();
                const scaleX = canvas.width / rect.width;
                const scaleY = canvas.height / rect.height;
                
                return {
                    x: (e.clientX - rect.left) * scaleX,
                    y: (e.clientY - rect.top) * scaleY
                };
            };

            const startDrawing = function(e) {
                const coords = getCoordinates(e);
                setIsDrawing(true);
                setPoints([coords]);
                setShowResult(false);
                setScore(null);
            };

            const draw = function(e) {
                if (!isDrawing) return;
                
                const coords = getCoordinates(e);
                const newPoints = [...points, coords];
                setPoints(newPoints);
                
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                
                ctx.strokeStyle = '#3b82f6';
                ctx.lineWidth = 3;
                ctx.lineCap = 'round';
                ctx.lineJoin = 'round';
                
                if (points.length > 0) {
                    ctx.beginPath();
                    ctx.moveTo(points[points.length - 1].x, points[points.length - 1].y);
                    ctx.lineTo(coords.x, coords.y);
                    ctx.stroke();
                }
            };

            const calculateCircleScore = function() {
                if (points.length < 10) return 0;
                
                const centerX = points.reduce(function(sum, p) { return sum + p.x; }, 0) / points.length;
                const centerY = points.reduce(function(sum, p) { return sum + p.y; }, 0) / points.length;
                
                const distances = points.map(function(p) {
                    return Math.sqrt(Math.pow(p.x - centerX, 2) + Math.pow(p.y - centerY, 2));
                });
                const avgRadius = distances.reduce(function(sum, d) { return sum + d; }, 0) / distances.length;
                
                const variance = distances.reduce(function(sum, d) { 
                    return sum + Math.pow(d - avgRadius, 2);
                }, 0) / distances.length;
                const stdDev = Math.sqrt(variance);
                
                const scoreVal = Math.max(0, 100 - (stdDev / avgRadius) * 200);
                
                return Math.round(scoreVal * 10) / 10;
            };

            const endDrawing = function() {
                if (!isDrawing) return;
                setIsDrawing(false);
                
                const finalScore = calculateCircleScore();
                setScore(finalScore);
                setShowResult(true);
                
                const newTotalGames = totalGames + 1;
                setTotalGames(newTotalGames);
                localStorage.setItem('totalGames', newTotalGames);
                
                if (finalScore > bestScore) {
                    setBestScore(finalScore);
                    localStorage.setItem('bestScore', finalScore);
                }
                
                if (points.length > 0) {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    
                    const centerX = points.reduce(function(sum, p) { return sum + p.x; }, 0) / points.length;
                    const centerY = points.reduce(function(sum, p) { return sum + p.y; }, 0) / points.length;
                    const distances = points.map(function(p) {
                        return Math.sqrt(Math.pow(p.x - centerX, 2) + Math.pow(p.y - centerY, 2));
                    });
                    const avgRadius = distances.reduce(function(sum, d) { return sum + d; }, 0) / distances.length;
                    
                    ctx.strokeStyle = '#10b981';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(centerX, centerY, avgRadius, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            };

            const reset = function() {
                const canvas = canvasRef.current;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#1e293b';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                ctx.strokeStyle = '#334155';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.beginPath();
                ctx.arc(300, 300, 150, 0, Math.PI * 2);
                ctx.stroke();
                ctx.setLineDash([]);
                
                setPoints([]);
                setScore(null);
                setShowResult(false);
            };

            const shareScore = function() {
                const text = '완벽한 원 그리기 게임에서 ' + score.toFixed(1) + '점을 획득했어요! 당신도 도전해보세요!';
                if (navigator.share) {
                    navigator.share({
                        title: '완벽한 원 그리기',
                        text: text,
                        url: window.location.href
                    });
                } else {
                    alert('점수: ' + score.toFixed(1) + '점!');
                }
            };

            const getScoreMessage = function(score) {
                if (score >= 95) return "🎯 완벽해요!";
                if (score >= 85) return "🌟 훌륭해요!";
                if (score >= 70) return "👍 잘했어요!";
                if (score >= 50) return "💪 괜찮아요!";
                return "🔄 다시 도전!";
            };

            const getScoreColor = function(score) {
                if (score >= 95) return "text-green-600";
                if (score >= 85) return "text-blue-600";
                if (score >= 70) return "text-purple-600";
                if (score >= 50) return "text-orange-600";
                return "text-red-600";
            };

            return React.createElement('div', {
                className: "min-h-screen bg-gradient-to-br from-slate-900 via-blue-900 to-slate-900 flex flex-col items-center justify-center p-4"
            },
                React.createElement('div', {
                    className: "bg-slate-800 rounded-2xl shadow-2xl p-6 md:p-8 w-full max-w-4xl"
                },
                    React.createElement('div', { className: "text-center mb-6" },
                        React.createElement('h1', { className: "text-3xl md:text-4xl font-bold text-white mb-2" }, "🎨 완벽한 원 그리기"),
                        React.createElement('p', { className: "text-slate-400" }, "마우스로 최대한 완벽한 원을 그려보세요!")
                    ),
                    React.createElement('div', { className: "flex flex-wrap justify-between items-center gap-3 mb-4" },
                        React.createElement('div', { className: "flex gap-3" },
                            React.createElement('div', { className: "flex items-center gap-2 bg-yellow-600 px-4 py-2 rounded-lg" },
                                React.createElement('span', { className: "text-2xl" }, "🏆"),
                                React.createElement('div', { className: "text-left" },
                                    React.createElement('div', { className: "text-xs text-yellow-100" }, "최고점"),
                                    React.createElement('div', { className: "text-white font-bold" }, bestScore.toFixed(1))
                                )
                            ),
                            React.createElement('div', { className: "flex items-center gap-2 bg-slate-700 px-4 py-2 rounded-lg" },
                                React.createElement('span', { className: "text-2xl" }, "🎮"),
                                React.createElement('div', { className: "text-left" },
                                    React.createElement('div', { className: "text-xs text-slate-400" }, "총 게임"),
                                    React.createElement('div', { className: "text-white font-bold" }, totalGames)
                                )
                            )
                        ),
                        React.createElement('button', {
                            onClick: reset,
                            className: "flex items-center gap-2 bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg transition transform hover:scale-105"
                        },
                            React.createElement('span', null, "🔄"),
                            "다시 그리기"
                        )
                    ),
                    React.createElement('div', { className: "relative" },
                        React.createElement('canvas', {
                            ref: canvasRef,
                            width: 600,
                            height: 600,
                            className: "border-4 border-slate-700 rounded-lg cursor-crosshair w-full touch-none bg-slate-900",
                            onMouseDown: startDrawing,
                            onMouseMove: draw,
                            onMouseUp: endDrawing,
                            onMouseLeave: endDrawing
                        }),
                        showResult && score !== null && React.createElement('div', {
                            className: "absolute inset-0 flex items-center justify-center bg-black bg-opacity-60 rounded-lg"
                        },
                            React.createElement('div', {
                                className: "bg-white rounded-2xl p-8 text-center animate-bounce-once shadow-2xl max-w-sm mx-4"
                            },
                                React.createElement('div', {
                                    className: "text-6xl font-bold mb-2 " + getScoreColor(score)
                                }, score.toFixed(1)),
                                React.createElement('div', {
                                    className: "text-3xl font-semibold text-slate-700 mb-4"
                                }, getScoreMessage(score)),
                                score > bestScore - 0.1 && React.createElement('div', {
                                    className: "text-yellow-600 font-bold mb-4"
                                }, "🎉 새로운 최고기록!"),
                                React.createElement('button', {
                                    onClick: shareScore,
                                    className: "bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg transition"
                                }, "📤 점수 공유하기")
                            )
                        )
                    ),
                    React.createElement('div', {
                        className: "mt-4 text-center text-slate-400 text-sm"
                    }, "💡 팁: 천천히, 일정한 속도로 그리면 높은 점수를 얻을 수 있어요!"),
                    React.createElement('div', {
                        className: "mt-4 flex flex-wrap justify-center gap-2"
                    },
                        React.createElement('div', {
                            className: "bg-slate-700 px-3 py-1 rounded text-xs text-slate-300"
                        }, "⭐ 95점 이상 = 완벽"),
                        React.createElement('div', {
                            className: "bg-slate-700 px-3 py-1 rounded text-xs text-slate-300"
                        }, "🎯 85점 이상 = 훌륭"),
                        React.createElement('div', {
                            className: "bg-slate-700 px-3 py-1 rounded text-xs text-slate-300"
                        }, "👍 70점 이상 = 좋음")
                    )
                ),
                React.createElement('footer', {
                    className: "mt-8 text-center text-slate-500 text-sm"
                },
                    React.createElement('p', null, "© 2026 완벽한 원 그리기 게임 | Made with ❤️")
                )
            );
        }

        ReactDOM.render(React.createElement(PerfectCircleGame), document.getElementById('root'));
    </script>
</body>
</html>
